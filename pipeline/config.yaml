# Research Pipeline Configuration for Yang Lu
# Repository: RMB_AI
# Created: 2026-11-24
#
# Four-bot Grok pipeline for equilibrium analysis research
# All bots use xAI Grok models with configurable reasoning levels

pipeline:
  name: "equilibrium-analysis"
  owner: "Yang Lu"
  description: "Research pipeline for equilibrium derivation, pseudocode generation, implementation, and academic writing"

# xAI API Configuration
# Credentials should be set via environment variable XAI_API_KEY
# Do NOT store API keys in this file
api:
  provider: "xai"
  base_url: "https://api.x.ai/v1"
  endpoint: "/responses"

# Model Configuration
# Verified against xAI docs (October 2026):
# - grok-4.7: reasoning.effort supports low, medium, high (default), xhigh
# - grok-4.6: reasoning.effort supports low, medium, high (default), xhigh
# - grok-4.5: reasoning.effort supports low, medium, high only (no xhigh)
#
# Default model is grok-4.7 (current flagship)
# Change to grok-4.6 if stability is preferred over latest features
defaults:
  model: "grok-4.7"
  model_alternatives:
    - "grok-4.6"
    - "grok-4.5"

# Bot Definitions
# Each bot has a specific role in the research pipeline
bots:
  # Bot 1: Equilibrium Derivation
  # Task: Derive theoretical equilibrium conditions from economic models
  # Requires: Maximum reasoning depth for mathematical proofs and derivations
  equilibrium_derivation:
    name: "Equilibrium Derivation Bot"
    description: "Derives theoretical equilibrium conditions from economic models"
    model: "grok-4.7"
    reasoning:
      effort: "xhigh"
      rationale: "Mathematical derivations and proofs require maximum reasoning depth"
    system_prompt: |
      You are an expert in economic theory and mathematical economics.
      Your task is to derive equilibrium conditions from economic models.
      Provide rigorous mathematical derivations with clear step-by-step reasoning.
      Use precise mathematical notation and justify each step.
    input_sources:
      - type: "reference_papers"
        path: "reference/"
      - type: "data_context"
        path: "data/"
    output_format: "latex"

  # Bot 2: Equilibrium to Pseudocode
  # Task: Translate equilibrium conditions into algorithmic pseudocode
  # Requires: Maximum reasoning for accurate mathematical-to-algorithmic translation
  equilibrium_to_pseudocode:
    name: "Equilibrium to Pseudocode Bot"
    description: "Translates equilibrium conditions into algorithmic pseudocode"
    model: "grok-4.7"
    reasoning:
      effort: "xhigh"
      rationale: "Accurate translation from mathematical conditions to algorithms requires deep reasoning"
    system_prompt: |
      You are an expert in translating mathematical economics into computational algorithms.
      Convert equilibrium conditions into clear, well-structured pseudocode.
      Ensure numerical stability and handle edge cases.
      Document assumptions and computational complexity.
    input_sources:
      - type: "derivation_output"
        from_bot: "equilibrium_derivation"
    output_format: "pseudocode"

  # Bot 3: Pseudocode to Python/Plots
  # Task: Implement pseudocode in Python and generate visualizations
  # Requires: Lower reasoning - implementation is more mechanical
  pseudocode_to_implementation:
    name: "Implementation Bot"
    description: "Implements pseudocode in Python and generates plots"
    model: "grok-4.7"
    reasoning:
      effort: "low"
      rationale: "Implementation from clear pseudocode is more mechanical, benefits from faster response"
    system_prompt: |
      You are an expert Python developer specializing in numerical computation and visualization.
      Implement the provided pseudocode using NumPy, SciPy, and Matplotlib.
      Follow PEP 8 style guidelines and include docstrings.
      Generate clear, publication-quality plots.
    input_sources:
      - type: "pseudocode_output"
        from_bot: "equilibrium_to_pseudocode"
    output_format: "python"
    dependencies:
      - "numpy"
      - "scipy"
      - "matplotlib"
      - "pandas"

  # Bot 4: Academic Writing/Style
  # Task: Polish research output for academic publication
  # Requires: Mid-to-high reasoning for nuanced academic writing
  academic_writing:
    name: "Academic Writing Bot"
    description: "Polishes research output for academic publication"
    model: "grok-4.7"
    reasoning:
      effort: "high"
      rationale: "Academic writing requires nuanced understanding but not maximum reasoning depth"
    system_prompt: |
      You are an expert academic editor specializing in economics and finance journals.
      Polish the research output for publication in top-tier journals.
      Ensure clarity, precision, and adherence to academic conventions.
      Maintain technical accuracy while improving readability.
    input_sources:
      - type: "derivation_output"
        from_bot: "equilibrium_derivation"
      - type: "implementation_output"
        from_bot: "pseudocode_to_implementation"
    output_format: "latex"
    style_guides:
      - "AER"
      - "Econometrica"

# Pipeline Execution Order
# Bots can run in parallel where dependencies allow
execution:
  stages:
    - stage: 1
      bots: ["equilibrium_derivation"]
      description: "Derive equilibrium conditions"
    - stage: 2
      bots: ["equilibrium_to_pseudocode"]
      description: "Convert to pseudocode"
      depends_on: ["equilibrium_derivation"]
    - stage: 3
      bots: ["pseudocode_to_implementation"]
      description: "Implement in Python"
      depends_on: ["equilibrium_to_pseudocode"]
    - stage: 4
      bots: ["academic_writing"]
      description: "Polish for publication"
      depends_on: ["equilibrium_derivation", "pseudocode_to_implementation"]

# Validation Rules
validation:
  require_api_key_env: true
  api_key_env_var: "XAI_API_KEY"
  allowed_reasoning_efforts:
    grok-4.7: ["low", "medium", "high", "xhigh"]
    grok-4.6: ["low", "medium", "high", "xhigh"]
    grok-4.5: ["low", "medium", "high"]
  required_bot_fields:
    - "name"
    - "model"
    - "reasoning"
    - "system_prompt"
